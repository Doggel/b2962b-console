name: Publish Windows release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: x64
      - name: Build the Windows download
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build.ps1 -Portable
      - name: Publish to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Release version must use vMAJOR.MINOR.PATCH.'
          }
          [string[]]$target = if ($env:GITHUB_EVENT_NAME -eq 'push') { '--verify-tag' } else { '--target', $env:GITHUB_SHA }
          $notes = @('--generate-notes')
          if (Test-Path -LiteralPath CHANGELOG.md) {
            $version = [regex]::Escape($env:RELEASE_VERSION)
            $changelog = Get-Content -LiteralPath CHANGELOG.md -Raw -Encoding utf8
            $entry = [regex]::Match($changelog, "(?ms)^## $version\r?\n(.*?)(?=^## |\z)")
            if ($entry.Success -and $entry.Groups[1].Value.Trim()) {
              $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
              Set-Content -LiteralPath $notesFile -Value $entry.Groups[1].Value.Trim() -Encoding utf8
              $notes = @('--notes-file', $notesFile)
            }
          }
          gh release create $env:RELEASE_VERSION `
            dist/B2962B_Console_Windows_x64.zip `
            @target --title "B2962B Console $env:RELEASE_VERSION" @notes
